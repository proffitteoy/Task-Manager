services:
  workbench-core:
    build:
      context: ..
      dockerfile: services/workbench-core/Dockerfile
    image: research-workstation/core:local
    container_name: workbench-core
    restart: unless-stopped
    ports:
      - "3900:3900"
    volumes:
      - ./data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 3900
      DATABASE_URL: file:/app/data/workbench.sqlite
      ACTIVITYWATCH_URL: http://host.docker.internal:5600
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      TOKEI_REPO: ${TOKEI_REPO:-}

  research-workstation-homepage:
    build:
      context: ..
      dockerfile: apps/homepage/Dockerfile
    image: research-workstation/homepage:local
    container_name: research-workstation-homepage
    restart: unless-stopped
    depends_on:
      - workbench-core
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      WORKBENCH_CORE_URL: http://workbench-core:3900
